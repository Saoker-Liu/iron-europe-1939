name: 部署游戏到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 检查地图与游戏逻辑
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node build_map.js --check
          node test_placement.js
          node test_geography.js
          node test_labels.js
          node test_render.js
          node test_transport.js
          node test_air.js
          node test_naval.js
          node test_naval_names.js
          node test_logic.js
      - name: 打包游戏和地图资料
        run: |
          mkdir -p _site/artifacts
          cp index.html README.md MAP_NOTES.md CITY_CATALOG.md NAVAL_CATALOG.md NAVAL_NAMES.md _site/
          cp -R js map_sources _site/
          cp artifacts/europe-1939-political.png artifacts/europe-1939-terrain.png artifacts/label-levels.png artifacts/naval-ports-detail.png artifacts/coast-river-detail.png _site/artifacts/
          touch _site/.nojekyll
          node -e "const fs=require('fs'),D=require('./js/data/load-node');fs.writeFileSync('_site/version.json',JSON.stringify({commit:process.env.GITHUB_SHA,mapVersion:D.MAP_META.version,cities:D.CITIES.length})+'\n');"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 确认仓库已启用 Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" --silent; then
            echo "::error::GitHub Pages 尚未启用或不可访问。请仓库管理员在 Settings > Pages 将 Source 设为 GitHub Actions，然后重新运行本工作流。"
            echo "部署未完成：需要仓库管理员启用 [GitHub Pages](https://github.com/$GITHUB_REPOSITORY/settings/pages)。私有仓库需支持私有仓库 Pages 的账户套餐。游戏检查与站点打包已完成。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
