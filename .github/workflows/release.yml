name: 发布 Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包游戏（zip）
        run: zip -r "iron-europe-1939-${GITHUB_REF_NAME}.zip" index.html js landing music map_sources README.md DIPLOMACY.md MAP_NOTES.md CITY_CATALOG.md GENERAL_CATALOG.md NAVAL_CATALOG.md NAVAL_NAMES.md AIR_CATALOG.md MUSIC.md DEVELOPMENT.md docs tools artifacts -x "artifacts/*.zip" "artifacts/render-map.py"
      - name: 创建 Release 并附上游戏包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "iron-europe-1939-${GITHUB_REF_NAME}.zip" \
            --title "钢铁欧陆 1939 ${GITHUB_REF_NAME}" \
            --notes "解压后双击 index.html 即可离线游玩；本仓库 Pages 启用并部署成功后的地址：https://ttdnx2999-cmd.github.io/test_collab/" \
            --generate-notes
