<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>钢铁欧陆 1939 · 二战六边形战棋</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #10141a;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #e8e4d8; }
  #cv { position: absolute; inset: 0; cursor: default; display: block; }

  /* ---- 启动加载层 ---- */
  #boot { position: absolute; inset: 0; z-index: 100; background: #10141a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; transition: opacity .5s; }
  #boot.hidden { opacity: 0; pointer-events: none; }
  .boot-title { font-size: 40px; font-weight: 900; letter-spacing: 10px; color: #d8b24a;
    text-shadow: 0 2px 12px #000; }
  .boot-sub { font-size: 13px; letter-spacing: 4px; color: #5a6a7a; margin-bottom: 18px; }
  .boot-bar { width: 420px; max-width: 80vw; height: 8px; background: #20262e;
    border: 1px solid #3a4757; border-radius: 4px; overflow: hidden; }
  #boot-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #8f6a1e, #d8b24a);
    transition: width .2s; }
  #boot-label { font-size: 12px; color: #9aa4b0; }

  /* ---- 顶栏 ---- */
  #topbar { position: absolute; top: 0; left: 0; right: 0; height: 46px; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
    background: linear-gradient(#1b222c, #141a22); border-bottom: 1px solid #2e3947;
    box-shadow: 0 2px 8px rgba(0,0,0,.5); overflow-x: auto; white-space: nowrap; gap: 14px; }
  #tb-left { display: flex; align-items: center; gap: 16px; font-size: 14px; }
  .fac-badge { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .fac-dot { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid #0006; }
  .stat { color: #d8b24a; font-weight: 700; }
  .stat small { color: #9aa4b0; font-weight: 400; }
  #tb-left, #tb-right { flex-shrink: 0; }
  #tb-right { display: flex; gap: 4px; }
  #tb-right .btn { padding: 6px 8px; }
  button { font-family: inherit; }
  .btn { background: #26303d; color: #e8e4d8; border: 1px solid #3a4757; border-radius: 4px;
    padding: 6px 12px; font-size: 13px; cursor: pointer; transition: background .15s; }
  .btn:hover { background: #33415280; background: #334152; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: #7a2f22; border-color: #a04232; font-weight: 700; }
  .btn.primary:hover { background: #93392a; }
  .btn.gold { background: #6b5a1e; border-color: #8f7a2e; }

  /* ---- 右侧面板 ---- */
  #panel { position: absolute; top: 56px; right: 12px; width: 296px; max-height: calc(100% - 220px);
    z-index: 15; background: rgba(17, 22, 29, .94); border: 1px solid #2e3947; border-radius: 6px;
    overflow-y: auto; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  #panel-body { padding: 12px; font-size: 13px; }
  .p-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  .p-sub { color: #9aa4b0; font-size: 12px; margin-bottom: 8px; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; border: 1px solid #3a4757; color: #b8c2cc; margin-right: 4px; }
  .hpbar { height: 10px; background: #20262e; border: 1px solid #0008; border-radius: 3px; overflow: hidden; margin: 6px 0; }
  .hpbar > div { height: 100%; transition: width .3s; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin: 8px 0; font-size: 12px; color: #c9d1da; }
  .grid2 b { color: #e8e4d8; float: right; }
  .gen-chip { background: #232c1a; border: 1px solid #5a6b32; border-radius: 4px; padding: 6px 8px; margin: 6px 0; font-size: 12px; }
  .gen-chip .gname { color: #d8b24a; font-weight: 700; }
  .gen-chip .gbio { color: #8f9a86; font-size: 11px; margin-top: 3px; line-height: 1.4; }
  .row-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .skill-list { margin-top: 4px; line-height: 1.6; color: #b9c48f; font-size: 11.5px; }

  .shop-item { display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 7px 8px; margin: 5px 0; background: #1d242e; border: 1px solid #2e3947; border-radius: 4px; cursor: pointer; }
  .shop-item:hover { border-color: #d8b24a; background: #26303d; }
  .shop-item.locked { opacity: .45; cursor: not-allowed; }
  .shop-item .s-name { font-size: 12.5px; font-weight: 600; }
  .shop-item .s-info { font-size: 11px; color: #9aa4b0; }
  .shop-item .s-cost { color: #d8b24a; font-weight: 700; white-space: nowrap; }

  /* ---- 日志 ---- */
  #log { position: absolute; left: 12px; bottom: 12px; width: 460px; z-index: 15;
    background: rgba(17, 22, 29, .88); border: 1px solid #2e3947; border-radius: 6px; overflow: hidden; }
  #log-head { padding: 5px 10px; font-size: 12px; font-weight: 700; color: #9aa4b0;
    background: #1a212b; cursor: pointer; border-bottom: 1px solid #2e3947; }
  #log-body { height: 130px; overflow-y: auto; padding: 6px 10px; font-size: 12px; line-height: 1.7; }
  #log-body.collapsed { display: none; }
  .lg-info { color: #8fa0b3; } .lg-battle { color: #d8a05a; } .lg-war { color: #e06a55; }
  .lg-econ { color: #9fc06a; } .lg-event { color: #c7a5e8; }

  /* ---- 提示 / 横幅 ---- */
  #tooltip { position: absolute; z-index: 30; pointer-events: none; display: none; max-width: 260px;
    background: rgba(12, 16, 22, .95); border: 1px solid #3a4757; border-radius: 4px; padding: 8px 10px; font-size: 12px; line-height: 1.6; }
  #banner { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 40;
    pointer-events: none; font-size: 34px; font-weight: 900; letter-spacing: 6px; color: #e8e4d8;
    text-shadow: 0 2px 12px #000, 0 0 4px #000; opacity: 0; transition: opacity .4s; }

  /* ---- 模态 ---- */
  #modal-root { position: absolute; inset: 0; z-index: 50; display: none;
    background: rgba(6, 9, 13, .72); backdrop-filter: blur(2px); overflow-y: auto; padding: 40px 16px; }
  .modal { max-width: 780px; margin: 0 auto; background: #161c25; border: 1px solid #3a4757;
    border-radius: 8px; padding: 26px 30px; box-shadow: 0 10px 40px #000a; }
  .modal h1 { font-size: 26px; margin-bottom: 4px; color: #e8e4d8; }
  .modal h1 .zh { color: #d8b24a; }
  .modal .sub { color: #9aa4b0; margin-bottom: 16px; font-size: 13px; }
  .fac-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
  .fac-card { background: #1d242e; border: 2px solid #2e3947; border-radius: 6px; padding: 14px; cursor: pointer; transition: all .15s; }
  .fac-card:hover { border-color: #56687e; }
  .fac-card.sel { border-color: #d8b24a; box-shadow: 0 0 12px #d8b24a33; }
  .fac-card h3 { font-size: 16px; margin-bottom: 6px; }
  .fac-card p { font-size: 11.5px; color: #9aa4b0; line-height: 1.55; min-height: 70px; }
  .fac-card .gens { font-size: 11px; color: #c9b06a; margin-top: 6px; line-height: 1.5; }
  .diff-row { display: flex; gap: 8px; margin: 14px 0; }
  .diff-opt { flex: 1; text-align: center; padding: 8px; background: #1d242e; border: 2px solid #2e3947; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .diff-opt.sel { border-color: #d8b24a; color: #d8b24a; font-weight: 700; }
  .modal .actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
  .gen-row { display: flex; gap: 10px; padding: 10px; border-bottom: 1px solid #232c38; align-items: flex-start; }
  .gen-portrait { width: 54px; height: 54px; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 1px 3px #000; border: 2px solid #d8b24a88; }
  .gen-info { flex: 1; font-size: 12.5px; line-height: 1.55; }
  .gen-info .gtitle { color: #d8b24a; font-weight: 700; font-size: 14px; }
  .gen-info .gstat { color: #9fc06a; }
  .gen-info .gbio2 { color: #8fa0b3; font-size: 11.5px; }
  .help-body { font-size: 13px; line-height: 1.8; color: #c9d1da; }
  .help-body h4 { color: #d8b24a; margin: 12px 0 4px; }
  .help-body table { border-collapse: collapse; margin: 6px 0; }
  .help-body td, .help-body th { border: 1px solid #2e3947; padding: 3px 9px; font-size: 12px; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #33404f; border-radius: 4px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<header id="topbar">
  <div id="tb-left">
    <span class="fac-badge"><span class="fac-dot" id="fac-dot"></span><span id="fac-name"></span></span>
    <span class="stat" id="gold"></span>
    <span id="date" style="color:#c9d1da"></span>
  </div>
  <div id="tb-right">
    <button class="btn" id="btn-atlas">地图全览</button>
    <button class="btn" id="btn-cities">查找城市</button>
    <button class="btn" id="btn-mapmode">政区 / 地形</button>
    <button class="btn" id="btn-units">隐藏部队</button>
    <button class="btn" id="btn-gen">🎖 将领</button>
    <button class="btn" id="btn-help">❓ 帮助</button>
    <button class="btn" id="btn-sound">🔊</button>
    <button class="btn" id="btn-save">💾 存档</button>
    <button class="btn primary" id="btn-end">结束回合 ⏎</button>
  </div>
</header>

<aside id="panel"><div id="panel-body"></div></aside>

<div id="log">
  <div id="log-head">📜 战报（点击折叠）</div>
  <div id="log-body"></div>
</div>

<div id="tooltip"></div>
<div id="map-legend" style="position:absolute;right:12px;width:296px;bottom:14px;z-index:4;pointer-events:none;background:#111b27ed;padding:10px 14px;border:1px solid #586673;border-radius:5px;font-size:12px;line-height:1.7">
  <div style="color:#ead6a4">文字层级：<span id="map-label-level">国家与主要地区</span></div>
  <div>滚轮缩放切换层级；继续放大即可显示全部城市名。</div>
  <b style="color:#dfc88e">欧洲 · 1939 年开战前夕</b><br>
  国界基准：1939.08.31　|　★ 首都<br>
  蓝色虚线：海运航线　|　蓝色实线：河流<br>
  海运 25 金 / 次，耗尽行动；渡河额外消耗 1 移动力<br>
  地形：浅绿平原 · 深绿森林 · 褐色丘陵 · 灰色山地
</div>
<div id="banner"></div>
<div id="modal-root"></div>

<div id="boot">
  <div class="boot-title">钢铁欧陆 1939</div>
  <div class="boot-sub">IRON EUROPE 1939-1945</div>
  <div class="boot-bar"><div id="boot-fill"></div></div>
  <div id="boot-label">正在初始化…</div>
</div>

<script src="js/loader.js"></script>
</body>
</html>
